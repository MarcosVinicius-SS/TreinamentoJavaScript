<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Livro de Dragões de Berk</title>
</head>
<body>

    <div class="wrapper">

        <div class="cover cover-left"></div>
        <div class="cover cover-right"></div>
        <div class="book">
       
            <!-- capa interna e pagina inicial -->
            <div class="book-page page-left">
                <div class="capa-interna">
                    <h1>O Livro de Dragões de Berk</h1>
                    <P>Codado na mao, Por Marcos Vinicius</P>
                </div>
            </div>
             <!-- PAgina 1 e 2 -->
            <div class="book-page page-right" id="turn-1">
                <div class="page-front">
                <h2>Furia da Noite</h2>
                <P>Página 1</P>
                <span class="nextprev-btn" data-page="turn-1">-›</span>
            </div>
            <div class="page-back">
                <h2>Curiosidades</h2>
                <p>Página 2</p>
                <span class="nextprev-btn back" data-page="turn-1">-›</span>
            </div>
        </div>
    </div>
</div>

        <script src="script.js"></script>

</body>
</html>
